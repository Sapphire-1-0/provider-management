components:
  schemas:
    AddressDto:
      type: object
      properties:
        streetAddress:
          type: string
        secondaryAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        county:
          type: string
        countyFIPS:
          type: string
    ContactDto:
      type: object
      properties:
        use:
          type: string
        address:
          $ref: "#/components/schemas/AddressDto"
        telecom:
          $ref: "#/components/schemas/TelecomDto"
        person:
          $ref: "#/components/schemas/PersonDto"
    CredentialingDto:
      type: object
      properties:
        elementId:
          type: string
        credentialingType:
          type: string
        geography:
          type: string
        fips:
          type: string
        committeeDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    DisorderDto:
      type: object
      properties:
        elementId:
          type: string
        disorderType:
          type: string
    HealthcareServiceDto:
      type: object
      properties:
        elementId:
          type: string
        healthcareServiceType:
          type: string
        state:
          type: string
        servicePopulation:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    HospitalPrivilegeDto:
      type: object
      properties:
        orgElementId:
          type: string
        hospitalPrivilegeType:
          type: string
    IdentifierDto:
      type: object
      properties:
        elementId:
          type: string
        value:
          type: string
        type:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        additionalProperties:
          type: object
          additionalProperties:
            type: object
    LanguageDto:
      type: object
      properties:
        elementId:
          type: string
        value:
          type: string
    LineOfBusinessDto:
      type: object
      properties:
        elementId:
          type: string
        code:
          type: string
        name:
          type: string
    LocationDto:
      type: object
      properties:
        elementId:
          type: string
        code:
          type: string
        name:
          type: string
        streetAddress:
          type: string
        secondaryAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        county:
          type: string
        countyFIPS:
          type: string
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyDto"
        locationNetwork:
          $ref: "#/components/schemas/LocationNetworkDto"
    LocationNetworkDto:
      type: object
      properties:
        panel:
          $ref: "#/components/schemas/PanelDto"
        isPCP:
          type: boolean
        isSpecialist:
          type: boolean
        isBehavioralHealth:
          type: boolean
        spans:
          type: array
          items:
            $ref: "#/components/schemas/LocationNetworkSpanDto"
    LocationNetworkSpanDto:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        termReason:
          type: string
    NetworkDto:
      type: object
      properties:
        elementId:
          type: string
        name:
          type: string
        code:
          type: string
        isHNETNetwork:
          type: boolean
        isVendorNetwork:
          type: boolean
        partOfProducts:
          type: array
          items:
            $ref: "#/components/schemas/ProductDto"
        partOfLineOfBusinesses:
          type: array
          items:
            $ref: "#/components/schemas/LineOfBusinessDto"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationDto"
        locationNetwork:
          $ref: "#/components/schemas/LocationNetworkDto"
    OrganizationDto:
      type: object
      properties:
        elementId:
          type: string
          description: Unique identifier for an element within the system
          example: "123456789"
        code:
          type: string
        name:
          type: string
          description: Name of the organization
          example: St. Joseph Hospital
        description:
          type: string
        aliasName:
          type: string
        type:
          type: string
        atypical:
          type: boolean
        capitated:
          type: boolean
        pcpPractitionerRequired:
          type: boolean
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/IdentifierDto"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/QualificationDto"
        networks:
          type: array
          items:
            $ref: "#/components/schemas/NetworkDto"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationDto"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactDto"
        specialties:
          type: array
          items:
            $ref: "#/components/schemas/SpecialtyDto"
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialingDto"
        healthcareServices:
          type: array
          items:
            $ref: "#/components/schemas/HealthcareServiceDto"
        disorders:
          type: array
          items:
            $ref: "#/components/schemas/DisorderDto"
      description: Represents an organization in the system
    PanelDto:
      type: object
      properties:
        highestAgeYears:
          type: integer
          format: int32
        lowestAgeYears:
          type: integer
          format: int32
        highestAgeMonths:
          type: integer
          format: int32
        lowestAgeMonths:
          type: integer
          format: int32
        genderLimitation:
          type: string
        ageLimitation:
          type: string
        status:
          type: string
    PersonDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        title:
          type: string
    PractitionerDto:
      type: object
      properties:
        elementId:
          type: string
        code:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
        altFirstName:
          type: string
        altLastName:
          type: string
        altMiddleName:
          type: string
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/IdentifierDto"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/QualificationDto"
        contractedOrganizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationDto"
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialingDto"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageDto"
        hospitalPrivileges:
          type: array
          items:
            $ref: "#/components/schemas/HospitalPrivilegeDto"
    ProductDto:
      type: object
      properties:
        elementId:
          type: string
        name:
          type: string
        code:
          type: string
    QualificationDto:
      type: object
      properties:
        elementId:
          type: string
        type:
          type: string
        issuer:
          type: string
        value:
          type: string
        specialtyTaxonomy:
          type: string
        state:
          type: string
        level:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    SpecialtyDto:
      type: object
      properties:
        elementId:
          type: string
        taxonomyCode:
          type: string
        specialty:
          type: string
        isPrimary:
          type: boolean
    TelecomDto:
      type: object
      properties:
        phone:
          type: string
        tty:
          type: string
        fax:
          type: string
        afterHoursNumber:
          type: string
        email:
          type: string
        secureEmail:
          type: string
        website:
          type: string
    SapphireAPIResponsePractitionerDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        statusCode:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 CONTENT_TOO_LARGE
          - 413 PAYLOAD_TOO_LARGE
          - 414 URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 421 MISDIRECTED_REQUEST
          - 422 UNPROCESSABLE_CONTENT
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 425 TOO_EARLY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
